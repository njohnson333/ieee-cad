<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f0fb"/><stop offset=".45" stop-color="#a9bdd8"/><stop offset="1" stop-color="#6e829f"/></linearGradient>
  <linearGradient id="steel2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dce8f7"/><stop offset="1" stop-color="#879bb7"/></linearGradient>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8 0L0 4l8 4z" fill="#111827"/></marker>
  <style>
    .o{fill:none;stroke:#111827;stroke-width:3}.d{fill:none;stroke:#111827;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}
    .e{fill:none;stroke:#111827;stroke-width:1.8}.c{fill:none;stroke:#4b5563;stroke-width:1.5;stroke-dasharray:10 7}
    .t{font-family:Arial,sans-serif;fill:#111827;font-size:25px}.s{font-size:21px}.h{font-size:28px;font-weight:700}
  </style>
</defs>
<rect width="1600" height="900" fill="#fff"/>

<!-- Isometric mug -->
<g transform="translate(55 55)">
  <ellipse cx="195" cy="70" rx="145" ry="58" fill="url(#steel)" stroke="#111827" stroke-width="3"/>
  <path d="M50 70v270c0 50 290 50 290 0V70" fill="url(#steel2)" stroke="#111827" stroke-width="3"/>
  <ellipse cx="195" cy="68" rx="126" ry="47" fill="#56677d" stroke="#111827" stroke-width="3"/>
  <path d="M340 125h48q70 0 70 68v106q0 70-70 70h-48v-43h44q29 0 29-31v-95q0-30-29-30h-44z" fill="url(#steel)" stroke="#111827" stroke-width="3"/>
  <text x="195" y="410" text-anchor="middle" class="t h">Isometric View</text>
</g>

<!-- top view -->
<g transform="translate(560 55)">
  <circle cx="190" cy="180" r="145" fill="url(#steel2)" stroke="#111827" stroke-width="3"/>
  <circle cx="190" cy="180" r="129.5" fill="#879bb7" stroke="#111827" stroke-width="3"/>
  <path d="M335 150h128a35 35 0 0 1 35 35v0a35 35 0 0 1-35 35H335z" fill="url(#steel)" stroke="#111827" stroke-width="3"/>
  <line x1="190" y1="20" x2="190" y2="340" class="c"/><line x1="25" y1="180" x2="515" y2="180" class="c"/>
  <line x1="45" y1="7" x2="335" y2="7" class="d"/><line x1="45" y1="14" x2="45" y2="55" class="e"/><line x1="335" y1="14" x2="335" y2="55" class="e"/>
  <text x="190" y="-2" text-anchor="middle" class="t">3.00"</text>
  <line x1="61" y1="46" x2="319" y2="46" class="d"/><text x="190" y="38" text-anchor="middle" class="t s">2.68"</text>
  <line x1="335" y1="110" x2="498" y2="110" class="d"/><line x1="335" y1="117" x2="335" y2="150" class="e"/><line x1="498" y1="117" x2="498" y2="160" class="e"/>
  <text x="416" y="100" text-anchor="middle" class="t s">1.00"</text>
  <line x1="525" y1="150" x2="525" y2="220" class="d"/><text x="545" y="192" class="t s">0.60"</text>
  <text x="190" y="385" text-anchor="middle" class="t h">Top View</text>
</g>

<!-- Wall thickness note -->
<g transform="translate(1195 100)">
  <rect width="330" height="140" rx="6" fill="#eef5ff" stroke="#111827" stroke-width="2"/>
  <text x="165" y="45" text-anchor="middle" class="t">Wall Thickness</text>
  <text x="165" y="78" text-anchor="middle" class="t">(Entire Mug):</text>
  <text x="165" y="118" text-anchor="middle" class="t h">0.16"</text>
</g>

<!-- Front view -->
<g transform="translate(65 525)">
  <rect x="40" y="10" width="260" height="245" rx="5" fill="url(#steel2)" stroke="#111827" stroke-width="3"/>
  <path d="M300 40h48q65 0 65 65v60q0 65-65 65h-48v-40h44q27 0 27-28v-54q0-28-27-28h-44z" fill="url(#steel)" stroke="#111827" stroke-width="3"/>
  <line x1="0" y1="10" x2="0" y2="255" class="d"/><line x1="7" y1="10" x2="40" y2="10" class="e"/><line x1="7" y1="255" x2="40" y2="255" class="e"/>
  <text x="8" y="142" class="t s">3.50"</text>
  <line x1="40" y1="286" x2="300" y2="286" class="d"/><line x1="40" y1="255" x2="40" y2="279" class="e"/><line x1="300" y1="255" x2="300" y2="279" class="e"/>
  <text x="170" y="316" text-anchor="middle" class="t s">3.00"</text>
  <text x="205" y="360" text-anchor="middle" class="t h">Front View</text>
</g>

<!-- Cross sectional view -->
<g transform="translate(590 525)">
  <path d="M50 10h250v245H50z" fill="url(#steel2)" stroke="#111827" stroke-width="3"/>
  <path d="M66 10h218v226H66z" fill="#677a92" stroke="#111827" stroke-width="2"/>
  <path d="M300 42h42q78 0 78 77v28q0 77-78 77h-42v-38h37q40 0 40-40v-26q0-40-40-40h-37z" fill="none" stroke="#111827" stroke-width="18"/>
  <line x1="175" y1="0" x2="175" y2="270" class="c"/>
  <line x1="66" y1="286" x2="284" y2="286" class="d"/><text x="175" y="316" text-anchor="middle" class="t s">2.68"</text>
  <text x="220" y="360" text-anchor="middle" class="t h">Cross Sectional View</text>
</g>

<!-- Handle detail -->
<g transform="translate(1205 500)">
  <rect x="20" y="20" width="24" height="250" fill="url(#steel2)" stroke="#111827" stroke-width="3"/>
  <path d="M44 40h90q70 0 70 70v70q0 70-70 70H44v-38h83q37 0 37-38v-58q0-38-37-38H44z" fill="url(#steel)" stroke="#111827" stroke-width="3"/>
  <line x1="44" y1="0" x2="204" y2="0" class="d"/><text x="124" y="-10" text-anchor="middle" class="t s">1.00"</text>
  <text x="151" y="46" class="t s">R0.30"</text><line x1="144" y1="50" x2="175" y2="70" class="e"/>
  <line x1="65" y1="105" x2="164" y2="105" class="d"/><text x="114" y="98" text-anchor="middle" class="t s">0.76"</text>
  <line x1="230" y1="78" x2="230" y2="212" class="d"/><text x="245" y="152" class="t s">1.36"</text>
  <text x="125" y="322" text-anchor="middle" class="t h">Handle Detail</text>
</g>
</svg>